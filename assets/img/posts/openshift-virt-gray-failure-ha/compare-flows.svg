<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">VMware gray failure vs OpenShift Virtualization fence</title>
  <desc id="desc">VMware HA stays idle while PowerStore floods until a human resets the host. OpenShift detects from kubelet Ready, fences with FAR, unmaps the volume, and starts a new VMI.</desc>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="240" y="32" text-anchor="middle" fill="#b45309" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="18" font-weight="700">VMware</text>
  <text x="720" y="32" text-anchor="middle" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="18" font-weight="700">OpenShift Virtualization</text>
  <rect x="16" y="48" width="448" height="430" rx="10" fill="#fffbf5" stroke="#b45309"/>
  <rect x="496" y="48" width="448" height="430" rx="10" fill="#f4f7fa" stroke="#0a3d62"/>

  <rect x="40" y="76" width="400" height="52" rx="6" fill="#c41e3a"/>
  <text x="240" y="108" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16">Catatonic host, BMC and FDM still up</text>
  <polygon points="240,140 232,128 248,128" fill="#9ca3af"/>
  <rect x="40" y="168" width="400" height="52" rx="6" fill="#e5e7eb"/>
  <text x="240" y="200" text-anchor="middle" fill="#6b7280" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700">HA idle / vCenter green</text>
  <polygon points="240,232 232,220 248,220" fill="#c41e3a"/>
  <rect x="40" y="260" width="400" height="52" rx="6" fill="#fef2f2" stroke="#c41e3a"/>
  <text x="240" y="292" text-anchor="middle" fill="#c41e3a" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16">PowerStore ports flood / other hosts slow</text>
  <polygon points="240,324 232,312 248,312" fill="#c41e3a"/>
  <rect x="40" y="352" width="400" height="52" rx="6" fill="#c41e3a"/>
  <text x="240" y="384" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16">Human hard reset / VM crash</text>
  <text x="240" y="444" text-anchor="middle" fill="#7f1d1d" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="15">Time-to-fence = war room</text>

  <rect x="520" y="76" width="400" height="52" rx="6" fill="#c41e3a"/>
  <text x="720" y="108" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16">Catatonic worker, BMC still up</text>
  <polygon points="720,140 712,128 728,128" fill="#0a3d62"/>
  <rect x="520" y="168" width="400" height="52" rx="6" fill="#0a3d62"/>
  <text x="720" y="200" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16">PLEG / Ready / metrics name the node</text>
  <polygon points="720,232 712,220 728,220" fill="#0a3d62"/>
  <rect x="520" y="260" width="400" height="52" rx="6" fill="#0a3d62"/>
  <text x="720" y="292" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16">FAR iDRAC reboot / CSI unmap</text>
  <polygon points="720,324 712,312 728,312" fill="#157f3d"/>
  <rect x="520" y="352" width="400" height="52" rx="6" fill="#157f3d"/>
  <text x="720" y="384" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16">New VMI on healthy worker / VM crash</text>
  <text x="720" y="444" text-anchor="middle" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="15">Time-to-fence = NHC + Redfish</text>
</svg>
