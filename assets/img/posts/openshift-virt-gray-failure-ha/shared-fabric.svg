<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Shared PowerStore frontend ports flood from a sick initiator</title>
  <desc id="desc">A catatonic host remains a noisy initiator on the FC or IP fabric. Healthy hosts share the same PowerStore frontend ports. QoS caps the storm; fencing stops it.</desc>
  <rect width="960" height="420" fill="#ffffff"/>
  <defs>
    <marker id="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c41e3a"/></marker>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0a3d62"/></marker>
  </defs>

  <rect x="24" y="20" width="180" height="88" rx="8" fill="#c41e3a"/>
  <text x="114" y="56" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700">Sick host</text>
  <text x="114" y="80" text-anchor="middle" fill="#fecaca" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13">noisy initiator</text>
  <rect x="228" y="20" width="180" height="88" rx="8" fill="#0a3d62"/>
  <text x="318" y="56" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700">Host B</text>
  <text x="318" y="80" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13">healthy compute</text>
  <rect x="432" y="20" width="180" height="88" rx="8" fill="#0a3d62"/>
  <text x="522" y="56" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700">Host C</text>
  <text x="522" y="80" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13">healthy compute</text>

  <line x1="114" y1="108" x2="114" y2="148" stroke="#c41e3a" stroke-width="5" marker-end="url(#hot)"/>
  <line x1="318" y1="108" x2="318" y2="148" stroke="#0a3d62" stroke-width="2" marker-end="url(#ok)"/>
  <line x1="522" y1="108" x2="522" y2="148" stroke="#0a3d62" stroke-width="2" marker-end="url(#ok)"/>

  <rect x="24" y="154" width="588" height="72" rx="8" fill="#fef2f2" stroke="#c41e3a" stroke-width="2"/>
  <text x="318" y="184" text-anchor="middle" fill="#c41e3a" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700">FC / IP fabric - shared links and ISLs</text>
  <text x="318" y="208" text-anchor="middle" fill="#7f1d1d" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13">thick arrow = flooded path from the sick initiator</text>
  <line x1="318" y1="226" x2="318" y2="262" stroke="#c41e3a" stroke-width="5" marker-end="url(#hot)"/>

  <rect x="24" y="268" width="588" height="80" rx="8" fill="#072a43"/>
  <text x="318" y="302" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700">Dell PowerStore frontend ports</text>
  <text x="318" y="326" text-anchor="middle" fill="#e5e7eb" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="14">one hot initiator raises latency for every host on those ports</text>

  <rect x="636" y="20" width="300" height="328" rx="8" fill="#f4f7fa" stroke="#d1d5db"/>
  <text x="786" y="56" text-anchor="middle" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="17" font-weight="700">Same on both platforms</text>
  <text x="656" y="96" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="14">PowerStore does not isolate a</text>
  <text x="656" y="116" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="14">catatonic initiator by itself.</text>
  <text x="656" y="152" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="14">See: host I/O and port queues</text>
  <text x="656" y="172" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="14">in PowerStore Manager.</text>
  <text x="656" y="208" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="14">Cap: host I/O limits, queue</text>
  <text x="656" y="228" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="14">depth, 1:many zoning.</text>
  <text x="656" y="264" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="14">Cut: fence the host so the</text>
  <text x="656" y="284" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="14">initiator actually stops.</text>
  <text x="656" y="320" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="15" font-weight="700">QoS buys time.</text>
  <text x="656" y="342" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="15" font-weight="700">It does not replace fencing.</text>

  <text x="480" y="392" text-anchor="middle" fill="#6b7280" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13">This is storage physics, not a hypervisor feature. vSphere HA does not stop I/O from a host it still classifies as up.</text>
</svg>
