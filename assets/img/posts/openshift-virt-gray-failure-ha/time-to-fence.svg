<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Order-of-magnitude time-to-fence for gray failure</title>
  <desc id="desc">VMware in this event is unbounded until a human notices. OpenShift Path A is often about 4 to 8 minutes with PLEG as the long pole. Path B without a watchdog is the same human clock.</desc>
  <rect width="960" height="360" fill="#ffffff"/>

  <text x="148" y="24" fill="#6b7280" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">T0 hang</text>
  <text x="340" y="24" fill="#6b7280" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">5 min</text>
  <text x="560" y="24" fill="#6b7280" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">10 min</text>
  <text x="780" y="24" fill="#6b7280" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">15 min+</text>
  <line x1="140" y1="36" x2="940" y2="36" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="140" cy="36" r="4" fill="#9ca3af"/>
  <circle cx="340" cy="36" r="4" fill="#9ca3af"/>
  <circle cx="540" cy="36" r="4" fill="#9ca3af"/>
  <circle cx="740" cy="36" r="4" fill="#9ca3af"/>
  <circle cx="940" cy="36" r="4" fill="#9ca3af"/>

  <text x="8" y="78" fill="#b45309" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700">VMware</text>
  <text x="8" y="94" fill="#b45309" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="11">this event</text>
  <rect x="140" y="64" width="800" height="36" rx="4" fill="#e5e7eb"/>
  <text x="156" y="87" fill="#6b7280" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700">HA idle - unbounded until a human notices</text>
  <rect x="540" y="64" width="240" height="36" rx="4" fill="#c41e3a"/>
  <text x="660" y="87" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700">typical war-room 5-15+ min</text>
  <rect x="790" y="64" width="150" height="36" rx="4" fill="#7f1d1d"/>
  <text x="865" y="87" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">reset + crash</text>

  <text x="8" y="148" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700">OpenShift</text>
  <text x="8" y="164" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="11">Path A</text>
  <rect x="140" y="136" width="110" height="32" rx="4" fill="#b45309"/>
  <text x="195" y="157" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="11">metrics 15-60s</text>
  <rect x="250" y="136" width="180" height="32" rx="4" fill="#0a3d62"/>
  <text x="340" y="157" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="11">PLEG to NotReady ~3 min</text>
  <rect x="430" y="136" width="70" height="32" rx="4" fill="#0a3d62"/>
  <text x="465" y="157" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="11">NHC 60s</text>
  <rect x="500" y="136" width="100" height="32" rx="4" fill="#072a43"/>
  <text x="550" y="157" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="11">FAR 30-90s</text>
  <rect x="600" y="136" width="130" height="32" rx="4" fill="#157f3d"/>
  <text x="665" y="157" text-anchor="middle" fill="#fff" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="11">unmap + VMI 30-90s</text>
  <text x="744" y="157" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700">~4-8 min</text>

  <text x="8" y="214" fill="#c41e3a" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700">OpenShift</text>
  <text x="8" y="230" fill="#c41e3a" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="11">Path B</text>
  <rect x="140" y="202" width="800" height="32" rx="4" fill="#fef2f2" stroke="#c41e3a"/>
  <text x="156" y="223" fill="#c41e3a" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700">Default NHC idle - same human clock unless watchdog / alerts fire</text>

  <rect x="16" y="256" width="300" height="88" rx="8" fill="#fff" stroke="#d1d5db"/>
  <text x="32" y="280" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700">Path A long pole</text>
  <text x="32" y="304" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">PLEG ~3 min, then NHC 60s.</text>
  <text x="32" y="322" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">Guest OS boot is extra on both.</text>

  <rect x="330" y="256" width="300" height="88" rx="8" fill="#fff" stroke="#d1d5db"/>
  <text x="346" y="280" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700">VMware if the host really dies</text>
  <text x="346" y="304" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">HA restart often ~1-3 min.</text>
  <text x="346" y="322" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">That path never started here.</text>

  <rect x="644" y="256" width="300" height="88" rx="8" fill="#fff" stroke="#d1d5db"/>
  <text x="660" y="280" fill="#0a3d62" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="700">Other hosts on PowerStore</text>
  <text x="660" y="304" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">Latency starts at T0 on both.</text>
  <text x="660" y="322" fill="#374151" font-family="system-ui, Segoe UI, Helvetica, sans-serif" font-size="12">It ends when the initiator is fenced.</text>
</svg>
